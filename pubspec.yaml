name: uav_platform_mobile
description: UAV Platform hybrid mobile app with native tracker support.
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  battery_plus: any
  device_info_plus: any
  geolocator: any
  http: any
  permission_handler: any
  shared_preferences: any
  wakelock_plus: any
  webview_flutter: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
