workflows:
  ios-testflight:
    name: UAV Platform iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_BUNDLE_ID: de.uavleipzig.uavplatformmobile
    scripts:
      - name: Ensure Flutter project files
        script: |
          if [ ! -d ios ]; then
            flutter create . --platforms=ios,android --org de.uavleipzig --project-name uav_platform_mobile
          fi
      - name: Set iOS bundle identifier
        script: |
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $APP_BUNDLE_ID;/g" ios/Runner.xcodeproj/project.pbxproj
          fi
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

  android-debug:
    name: UAV Platform Android Debug
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
      vars:
        ANDROID_APP_ID: de.uavleipzig.uavplatformmobile
    scripts:
      - name: Ensure Flutter project files
        script: |
          if [ ! -d android ]; then
            flutter create . --platforms=ios,android --org de.uavleipzig --project-name uav_platform_mobile
          fi
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
